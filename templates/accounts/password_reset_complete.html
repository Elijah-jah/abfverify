{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Complete | ABFverify</title>

    <link rel="shortcut icon" href="{% static 'images/mylogo1.png' %}" type="image/x-icon">

    <link rel="stylesheet" href="{% static 'css/password_reset_complete.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"

<body>

<div class="apollo-container">

    <div class="apollo-card">

        <div class="apollo-icon">

        <h1>Password Reset Successful</h1>

        <a href="{% url 'login' %}" class="apollo-btn">

        </a>

    </div>

</div>
