{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | ABFverify</title>

    <link rel="stylesheet" href="{% static 'css/reset_password.css' %}">
    <link rel="stylesheet" href="{% static 'css/toast.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="reset-wrapper">

    <!-- LEFT -->

    <div class="reset-brand">

        <div class="brand-logo">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h1>Create New Password</h1>

        <p>
            Your new password should be strong, unique and known only to you.
        </p>

    </div>

    <!-- RIGHT -->

    <div class="reset-card">

        <h2>Reset Password</h2>

        <p class="subtext">
            Enter your new password below.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">

                <label>New Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password1"
                        name="password1"
                        placeholder="Enter new password"
                        required
                    >

                    <i class="fa-solid fa-eye toggle-password"
                       data-target="password1"></i>

                </div>

            </div>

            <div class="input-group">

                <label>Confirm Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password2"
                        name="password2"
                        placeholder="Confirm new password"
                        required
                    >

                    <i class="fa-solid fa-eye toggle-password"
                       data-target="password2"></i>

                </div>

            </div>

            <button class="reset-btn" type="submit">

                <i class="fa-solid fa-key"></i>

                Update Password

            </button>

        </form>

    </div>

</div>

<div class="toast-container"></div>

<script src="{% static 'js/dashboard_base.js' %}"></script>
<script src="{% static 'js/toast.js' %}"></script>

<script>

// Show / Hide Password

document.querySelectorAll(".toggle-password").forEach(function(icon){

    icon.addEventListener("click",function(){

        const input=document.getElementById(
            this.dataset.target
        );

        if(input.type==="password"){

            input.type="text";

            this.classList.remove("fa-eye");

            this.classList.add("fa-eye-slash");

        }else{

            input.type="password";

            this.classList.remove("fa-eye-slash");

            this.classList.add("fa-eye");

        }

    });

});

{% if messages %}
{% for message in messages %}
showToast(
"{{ message.tags }}",
"{{ message|escapejs }}"
);
{% endfor %}
{% endif %}

</script>

</body>
</html>
