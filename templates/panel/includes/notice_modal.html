{% load static %}

{% if show_notice %}
<!-- NEW UPDATE MODAL -->
<div class="notice-modal" id="noticeModal">
    <div class="notice-box">
        <div class="notice-header">
            <div class="notice-icon-wrap">
                <i class="fa-solid fa-bullhorn"></i>
            </div>
            <h2>New Update</h2>
        </div>
        <div class="notice-body">
            <p class="notice-message">
                Join our Telegram channel to receive the latest updates, announcements,
                 and fast notifications about ABFverify. Stay ahead and never miss important news
                 click the link below to join now!
            </p>
        </div>
        <div class="notice-actions">
            <a href="https://t.me/abfverifysocials" target="_blank" class="btn btn-telegram">
                <i class="fa-brands fa-telegram"></i>
                Join New Channel
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:0.75rem;"></i>
            </a>
            <button type="button" class="btn btn-copy" onclick="copyTelegramLink()">
                <i class="fa-regular fa-copy"></i>
                Copy Link
            </button>
            <form action="{% url 'dismiss_notice' %}" method="post" style="display:inline; width:100%;">
                {% csrf_token %}
                <button type="submit" class="btn btn-gotit">Got it, thanks!</button>
            </form>
        </div>
    </div>
</div>

<style>
.notice-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    padding: 1rem;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}
.notice-modal.show {
    opacity: 1;
    visibility: visible;
}
.notice-box {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    overflow: hidden;
    transform: scale(0.9);
    transition: transform 0.3s ease;
    border: 2px solid #0d6efd;
}
.notice-modal.show .notice-box {
    transform: scale(1);
}
.notice-header {
    background: linear-gradient(135deg, #0d6efd, #0b5ed7);
    color: #fff;
    text-align: center;
    padding: 1.5rem 1.5rem 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.notice-icon-wrap {
    width: 56px;
    height: 56px;
    background: #dc3545;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.75rem;
    box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
}
.notice-icon-wrap i { font-size: 1.6rem; color: #fff; }
.notice-header h2 { margin: 0; font-size: 1.4rem; font-weight: 700; }
.notice-body { padding: 1.25rem 1.5rem; }
.notice-message {
    text-align: center;
    font-size: 0.95rem;
    color: #444;
    line-height: 1.6;
    margin: 0;
}
.notice-actions {
    padding: 0 1.5rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
}
.btn-telegram {
    background: #0088cc;
    color: #fff !important;
    border: none;
    padding: 0.85rem;
    border-radius: 10px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
}
.btn-telegram:hover { background: #0077b3; transform: translateY(-1px); }
.btn-copy {
    background: transparent;
    color: #666;
    border: 1px solid #ddd;
    padding: 0.75rem;
    border-radius: 10px;
    font-weight: 500;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
    font-size: 0.9rem;
}
.btn-copy:hover { background: #f8f9fa; border-color: #ccc; }
.btn-gotit {
    background: #0d6efd;
    color: #fff;
    border: none;
    padding: 0.85rem;
    border-radius: 10px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    width: 100%;
    font-size: 0.95rem;
}
.btn-gotit:hover { background: #0b5ed7; transform: translateY(-1px); }
@keyframes np { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
body.dark .notice-box, html[data-theme="dark"] .notice-box { background: #1e1e2f; border-color: #3b82f6; }
body.dark .notice-message, html[data-theme="dark"] .notice-message { color: #d0d0d0; }
body.dark .btn-gotit, html[data-theme="dark"] .btn-gotit { background: #2563eb; }
body.dark .btn-copy, html[data-theme="dark"] .btn-copy { color: #aaa; border-color: #444; }
body.dark .btn-copy:hover, html[data-theme="dark"] .btn-copy:hover { background: #2a2a3f; border-color: #555; }
@media (max-width: 576px) {
    .notice-box { margin: 0.5rem; }
    .notice-header h2 { font-size: 1.2rem; }
    .notice-message { font-size: 0.88rem; }
}
</style>

<script>
(function(){
    var m = document.getElementById('noticeModal');
    if(m){ setTimeout(function(){ m.classList.add('show'); }, 300); }
    if(m){ m.onclick = function(e){ if(e.target === m) m.classList.remove('show'); }; }
})();
function copyTelegramLink() {
    var link = "https://t.me/abfverifysocials";
    navigator.clipboard.writeText(link).then(function() {
        var btn = document.querySelector('.btn-copy');
        var original = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        btn.style.color = '#28a745';
        btn.style.borderColor = '#28a745';
        setTimeout(function() {
            btn.innerHTML = original;
            btn.style.color = '';
            btn.style.borderColor = '';
        }, 2000);
    });
}
</script>
{% endif %}
