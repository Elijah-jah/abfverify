{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error | ABFverify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --bg: #f0f4ff;
            --card: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #64748b;
            --blue: #0d6efd;
            --blue-dark: #0b5ed7;
            --shadow: 0 20px 60px rgba(13, 110, 253, 0.12);
            --border: #0d6efd;
        }
        body.dark, html[data-theme="dark"] body {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            --border: #3b82f6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .box {
            background: var(--card);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            animation: popIn 0.4s ease;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #dc3545 0%, #ff6b6b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: #fff;
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.3);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .code {
            font-size: 4rem;
            font-weight: 800;
            color: #dc3545;
            line-height: 1;
            margin-bottom: 0.5rem;
            opacity: 0.2;
        }
        h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; }
        p { color: var(--text-secondary); margin-bottom: 1.75rem; line-height: 1.6; font-size: 0.95rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%);
            color: #fff;
            padding: 0.85rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(13, 110, 253, 0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(13, 110, 253, 0.4); }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">500</div>
        <div class="icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h1>Server Error</h1>
        <p>Something went wrong on our end. We're working to fix it. Please try again in a few minutes.</p>
        <a href="{% url 'dashboard' %}" class="btn"><i class="fa-solid fa-rotate-right"></i> Try Again</a>
    </div>
</body>
</html>
