{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Too Many Requests | ABFverify</title>
    <link rel="icon" href="{% static 'images/mylogo1.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{
            /* gradient accent — panel language */
            --grad: linear-gradient(135deg, #38bdf8, #818cf8);
            --grad-soft: rgba(56, 189, 248, 0.12);
            --grad-line: rgba(56, 189, 248, 0.28);

            /* DARK MODE (default) */
            --bg: #0f172a;
            --card: #111827;
            --text: #e5e7eb;
            --text-secondary: #94a3b8;
            --border: #1f2937;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        body.light{
            --grad: linear-gradient(135deg, #0ea5e9, #6366f1);
            --grad-soft: rgba(14, 165, 233, 0.10);
            --grad-line: rgba(14, 165, 233, 0.28);

            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        *{ margin: 0; padding: 0; box-sizing: border-box; }

        html, body{ overflow-x: hidden; max-width: 100%; }

        body{
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .box{
            background: var(--card);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            animation: popIn 0.4s ease;
        }

        @keyframes popIn{
            from{ opacity: 0; transform: scale(0.92); }
            to{ opacity: 1; transform: scale(1); }
        }

        .icon{
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: #fff;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float{
            0%, 100%{ transform: translateY(0); }
            50%{ transform: translateY(-8px); }
        }

        h1{
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        p{
            color: var(--text-secondary);
            margin-bottom: 1.75rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .btn{
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--grad);
            color: #fff;
            padding: 0.85rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: filter 0.2s ease, transform 0.2s ease;
            box-shadow: 0 6px 18px rgba(56, 189, 248, 0.28);
        }

        .btn:hover{
            filter: brightness(1.1);
            transform: translateY(-2px);
            color: #fff;
        }

        
    </style>
<base target="_blank">
</head>
<body>

<!-- Apply saved theme BEFORE first paint -->
<script>
(function () {
    try {
        if (localStorage.getItem("theme") === "light") {
            document.body.classList.add("light");
        }
    } catch (e) {}
})();
</script>

<div class="box">
    <div class="icon"><i class= + icon_class + ></i></div>
    <h1>Too Many Requests</h1>
    <p>You've made too many requests in a short time. Please wait a few minutes and try again.</p>
    <a href="{% url 'login' %}" class="btn"><i class= + btn_icon + ></i> Back to Login</a>
</div>

</body>
</html>
